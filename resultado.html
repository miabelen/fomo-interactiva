<!doctype html><html lang="es-AR"><head><link rel="icon" type="image/png" href="isotipo-fomo.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOMO — Creación colectiva</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090a;color:#f1f0eb;font-family:Arial,Helvetica,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E")}#art{position:fixed;inset:0;width:100%;height:100%}#overlay{position:fixed;inset:0;pointer-events:none}#wait{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;width:min(90%,650px)}h1{font-size:clamp(34px,6vw,74px);letter-spacing:-.055em;line-height:.98;margin:15px 0}p{color:#aaa;line-height:1.5}.tag{font-size:11px;letter-spacing:.2em;color:#00d9e8;font-weight:800}#phrase{position:absolute;left:12%;top:21%;font-size:clamp(12px,1.4vw,20px);letter-spacing:.045em;font-weight:700;opacity:0;transition:none;max-width:40%;text-shadow:0 0 2px #fff}#phrase.pos1{left:60%;top:20%}#phrase.pos2{left:18%;top:72%}#phrase.pos3{left:59%;top:73%}#final{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:90%;font-weight:900;font-size:clamp(26px,4.3vw,68px);line-height:1.04;letter-spacing:-.045em;opacity:0;transition:opacity 1.8s;pointer-events:none}#final.visible{opacity:1}#controls{position:fixed;bottom:22px;right:24px;display:flex;gap:10px;z-index:3}button{background:#17191b;color:#f1f0eb;border:1px solid #555;border-radius:40px;padding:12px 20px;cursor:pointer;font-size:12px;font-weight:800}button:hover{border-color:#00d9e8}#status{position:fixed;top:22px;right:26px;font-size:10px;letter-spacing:.16em;color:#a4a4a4}#logo{position:fixed;top:18px;left:24px;width:76px;height:48px;object-fit:contain;object-position:left center;z-index:2}#fade{position:fixed;inset:0;background:#08090a;opacity:0;pointer-events:none;transition:opacity .8s}

</style></head><body><canvas id="art"></canvas><canvas id="typeParticles" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2"></canvas><canvas id="touchCanvas"></canvas><div id="hint">TOCÁ O DIBUJÁ EN LA PANTALLA PARA DEJAR TU HUELLA</div><div id="overlay"><div id="wait"><div class="tag">FOMO / EXPERIENCIA COLECTIVA</div><h1>ESPERANDO A LOS DEMÁS.</h1><p>La creación comienza cuando las tres intervenciones estén listas.</p><p id="count">0 / 3 confirmadas</p></div><div id="phrase"></div><div id="final">NINGUNO HIZO TODO.<br>PERO TODOS DEJARON ALGO.</div></div><div id="status">CREACIÓN COLECTIVA</div><div id="controls"><button id="restart">REINICIAR</button></div>
<script>
// Sincronización remota FOMO: servidor compartido, sin alterar la interfaz.
window.FOMO_REMOTE = {
  state:{}, epoch:0, listeners:[], resetListeners:[], strokeListeners:[],
  async request(path,method='GET',data){const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data),cache:'no-store'});if(!r.ok)throw Error('Conexión FOMO: '+r.status);return r.json()},
  async init(){try{const s=await this.request('/api/state');this.state=s.state;this.epoch=s.epoch;this.listeners.forEach(f=>f());}catch(e){console.error(e);this.showOffline()}
    const stream=new EventSource('/api/events');stream.addEventListener('state',e=>{const s=JSON.parse(e.data);if(s.epoch!==this.epoch){this.epoch=s.epoch;this.state=s.state;this.resetListeners.forEach(f=>f())}else{this.state=s.state;this.listeners.forEach(f=>f())}});
    stream.addEventListener('stroke',e=>this.strokeListeners.forEach(f=>f(JSON.parse(e.data))));stream.onerror=()=>this.showOffline();stream.onopen=()=>document.getElementById('fomo-offline')?.remove();
  },
  showOffline(){if(document.getElementById('fomo-offline'))return;const x=document.createElement('div');x.id='fomo-offline';x.textContent='SIN CONEXIÓN CON FOMO · Revisá Internet';Object.assign(x.style,{position:'fixed',top:'8px',right:'8px',zIndex:'99999',background:'#17191b',color:'#fff',padding:'10px 15px',border:'1px solid #00d9e8',font:'12px Arial'});document.body.append(x)},
  async choose(role,value){const s=await this.request('/api/choice','POST',{role,value});this.state=s.state;this.listeners.forEach(f=>f())},
  async unchoose(role){const s=await this.request('/api/unchoose','POST',{role});this.state=s.state;this.listeners.forEach(f=>f())},
  async reset(){const s=await this.request('/api/reset','POST',{});this.state=s.state;this.epoch=s.epoch;this.resetListeners.forEach(f=>f())},
  stroke(data){fetch('/api/stroke',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).catch(()=>{})}
};
</script>
<script>
const KEY='fomo_stage1_v711';const shapes=["M 16 47 C 9 28 29 12 45 23 C 61 35 76 10 87 29 C 99 49 77 66 58 62 C 41 58 32 86 17 69 C 10 61 11 54 16 47 Z", "M 15 40 C 17 18 35 19 51 26 C 70 33 85 20 88 42 C 91 60 75 70 59 65 C 42 60 29 82 18 65 C 14 57 13 49 15 40 Z", "M 27 15 C 41 5 49 23 58 27 C 73 31 88 14 88 36 C 89 54 71 57 69 71 C 67 91 43 88 35 73 C 26 59 10 64 13 45 C 15 33 19 22 27 15 Z", "M 22 25 C 37 8 56 22 62 35 C 69 49 88 48 83 66 C 77 85 58 79 44 73 C 30 67 15 82 12 61 C 10 45 12 35 22 25 Z", "M 32 12 C 50 4 59 26 60 42 C 61 56 87 53 84 72 C 82 90 60 87 47 79 C 32 69 14 81 13 61 C 11 42 18 20 32 12 Z", "M 17 37 C 25 13 44 27 57 22 C 75 15 89 23 86 41 C 83 57 62 52 61 68 C 60 88 36 89 29 73 C 23 59 9 61 17 37 Z", "M 30 14 C 46 6 53 29 68 25 C 85 21 94 39 80 52 C 67 65 79 79 59 85 C 40 91 39 71 26 69 C 7 65 11 37 30 14 Z", "M 21 28 C 34 12 51 15 61 29 C 71 43 88 32 88 53 C 88 74 66 77 51 71 C 35 65 30 88 16 73 C 5 61 11 41 21 28 Z"];const canvas=document.getElementById('art'),ctx=canvas.getContext('2d'),wait=document.getElementById('wait'),count=document.getElementById('count'),phrase=document.getElementById('phrase'),final=document.getElementById('final');
const read=()=>FOMO_REMOTE.state;let state={},start=null,seen=false,W=0,H=0,dpr=1;function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function sync(){state=read();let n=['color','movimiento','forma'].filter(k=>state[k]?.ready).length;count.textContent=n+' / 3 confirmadas';if(n===3&&!seen){seen=true;start=performance.now();wait.style.display='none'}else if(n<3){seen=false;start=null;wait.style.display='block';final.classList.remove('visible');phrase.style.opacity='0'}}FOMO_REMOTE.listeners.push(sync);FOMO_REMOTE.resetListeners.push(handleReset);FOMO_REMOTE.init();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const ease=t=>t*t*(3-2*t);const phrases=['CADA DECISIÓN DEJA UNA HUELLA.','NO TODO TIENE QUE SER IGUAL.','UNA MIRADA TAMBIÉN PUEDE QUEDARSE.','LO QUE CONSTRUIMOS NOS TRANSFORMA.'];let lastPhrase=-1;
const particleCanvas=document.getElementById('typeParticles'),pc=particleCanvas.getContext('2d');let outgoing=[];
function resizeParticles(){particleCanvas.width=Math.round(innerWidth*dpr);particleCanvas.height=Math.round(innerHeight*dpr);pc.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resizeParticles);resizeParticles();
function dissolvePhrase(now){const rect=phrase.getBoundingClientRect();if(!rect.width||!rect.height)return;const style=getComputedStyle(phrase),ratio=Math.min(devicePixelRatio||1,2),off=document.createElement('canvas');off.width=Math.ceil(rect.width*ratio);off.height=Math.ceil(rect.height*ratio);const oc=off.getContext('2d');oc.scale(ratio,ratio);oc.font=style.font;oc.textBaseline='top';oc.fillStyle='#f1f0eb';const lineHeight=parseFloat(style.lineHeight)||parseFloat(style.fontSize)*1.2;const words=phrase.textContent.split(' ');let line='',lines=[];for(const word of words){const test=line?line+' '+word:word;if(oc.measureText(test).width>rect.width&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);lines.forEach((line,i)=>oc.fillText(line,0,i*lineHeight));const data=oc.getImageData(0,0,off.width,off.height).data;const step=Math.max(2,Math.round(3*ratio));for(let yy=0;yy<off.height;yy+=step)for(let xx=0;xx<off.width;xx+=step){if(data[(yy*off.width+xx)*4+3]>130){const seed=Math.sin(xx*12.9898+yy*78.233)*43758.5453,rand=seed-Math.floor(seed);outgoing.push({x:rect.left+xx/ratio,y:rect.top+yy/ratio,vx:(rand-.5)*65,vy:-(18+rand*45),birth:now+rand*190,life:700+rand*450,size:1.1})}}}
function renderParticles(now){pc.clearRect(0,0,W,H);outgoing=outgoing.filter(p=>now<p.birth+p.life);pc.fillStyle='#f1f0eb';for(const p of outgoing){if(now<p.birth)continue;const v=(now-p.birth)/p.life;pc.globalAlpha=(1-v)*.7;pc.fillRect(p.x+p.vx*v,p.y+p.vy*v*v,p.size,p.size)}pc.globalAlpha=1}
function makeSmoothRoute(raw){if(!raw||raw.length<2)return null;let pts=[raw[0]];for(let i=1;i<raw.length;i++){const q=raw[i],prev=pts[pts.length-1];if(Math.hypot((q.x-prev.x)*W,(q.y-prev.y)*H)>3)pts.push(q)}if(pts.length<2)return null;const samples=[];for(let i=0;i<pts.length-1;i++){let p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];for(let j=0;j<12;j++){const t=j/12,t2=t*t,t3=t2*t;let calc=k=>.5*((2*p1[k])+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3);samples.push({x:clamp(calc('x'),.06,.94),y:clamp(calc('y'),.09,.91)})}}samples.push(pts[pts.length-1]);let cumulative=[0];for(let i=1;i<samples.length;i++)cumulative.push(cumulative[i-1]+Math.hypot((samples[i].x-samples[i-1].x)*W,(samples[i].y-samples[i-1].y)*H));return{samples,cumulative,total:cumulative.at(-1)}}
let routeCache=null,routeKey='';
function positionOnRoute(pts,t){const key=JSON.stringify(pts)+W+'x'+H;if(key!==routeKey){routeKey=key;routeCache=makeSmoothRoute(pts)}if(!routeCache||!routeCache.total)return{x:.5*W,y:.5*H};const loop=17;let phase=(t%loop)/loop;let u=(1-Math.cos(phase*2*Math.PI))/2;const distance=u*routeCache.total,arr=routeCache.cumulative;let lo=0,hi=arr.length-1;while(lo<hi){const m=(lo+hi)>>1;if(arr[m]<distance)lo=m+1;else hi=m}const i=Math.max(1,lo),f=(distance-arr[i-1])/Math.max(.00001,arr[i]-arr[i-1]);const a=routeCache.samples[i-1],b=routeCache.samples[i];return{x:(a.x+(b.x-a.x)*f)*W,y:(a.y+(b.y-a.y)*f)*H}}

function render(now){requestAnimationFrame(render);ctx.clearRect(0,0,W,H);if(!seen)return;let t=(now-start)/1000;const colors=state.color.value,pts=state.movimiento.value,shape=shapes[state.forma.value]||shapes[0];if(!pts?.length||!colors?.length)return;
// Subtle moving hairlines in background.
ctx.lineWidth=.5;for(let j=0;j<13;j++){ctx.beginPath();ctx.strokeStyle='rgba(80,150,155,.11)';for(let x=0;x<=W;x+=12){let y=H*(.14+j*.058)+Math.sin(x*.007+j*.7+t*.25)*9+Math.sin(x*.014+t*.18)*4;if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke()}
// Drawn motion follows original normalized points, with smooth interpolation and eased looping.
let {x,y}=positionOnRoute(pts,t);
let scale=Math.min(W,H)*.0023;ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(t*.5)*.08);ctx.scale(scale*(1+Math.sin(t*.55)*.038),scale*(1+Math.cos(t*.48)*.04));let path=new Path2D(shape);const colorDuration=3.8;const colorPhase=t/colorDuration;const colorIndex=Math.floor(colorPhase)%colors.length;const nextIndex=(colorIndex+1)%colors.length;const fraction=colorPhase-Math.floor(colorPhase);const blend=ease(clamp((fraction-.72)/.28,0,1));ctx.fillStyle=colors[colorIndex];ctx.shadowColor=colors[colorIndex];ctx.shadowBlur=8;ctx.fill(path);if(colors.length>1&&blend>0){ctx.globalAlpha=blend;ctx.fillStyle=colors[nextIndex];ctx.fill(path);ctx.globalAlpha=1;}ctx.restore();
// Background microtype enters and leaves before the final statement.
let phase=t-8;if(phase>=0&&phase<22){let idx=Math.floor(phase/5.5),local=phase%5.5;if(idx!==lastPhrase){lastPhrase=idx;phrase.dataset.dissolved='';phrase.textContent=phrases[idx];phrase.className='pos'+idx;phrase.style.opacity='0'}if(local<.55){phrase.style.opacity=String(Math.min(.7,local/.55*.7))}else if(local<4.05){phrase.style.opacity='.7'}else{if(!phrase.dataset.dissolved||phrase.dataset.dissolved!==String(idx)){dissolvePhrase(now);phrase.dataset.dissolved=String(idx)}phrase.style.opacity='0'}}else{phrase.style.opacity='0'}renderParticles(now);if(t>31)final.classList.add('visible');}
requestAnimationFrame(render);
// Trazos efímeros blancos: cada segmento desaparece por antigüedad.
// BroadcastChannel sincroniza entre pestañas del mismo origen; no sustituye un servidor para computadoras distintas.
const touchCanvas=document.getElementById('touchCanvas'),tc=touchCanvas.getContext('2d');
const channel=typeof BroadcastChannel!=='undefined'?new BroadcastChannel('fomo_huellas_v76'):null;
let strokes=[],sparks=[],activeStroke=null,strokeId=0,drawSeq=0;
function touchResize(){const d=Math.min(devicePixelRatio||1,2);touchCanvas.width=Math.round(innerWidth*d);touchCanvas.height=Math.round(innerHeight*d);tc.setTransform(d,0,0,d,0,0)}addEventListener('resize',touchResize);touchResize();
function drawPoint(e){return{x:e.clientX/innerWidth,y:e.clientY/innerHeight,t:performance.now()}}
function burst(p){for(let i=0;i<5;i++){const a=Math.random()*Math.PI*2,v=10+Math.random()*38;sparks.push({x:p.x*innerWidth,y:p.y*innerHeight,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:performance.now(),life:450+Math.random()*500})}}
function acceptStroke(id,p,remote=false){let st=strokes.find(s=>s.id===id);if(!st){st={id,points:[]};strokes.push(st)}st.points.push({...p,t:performance.now()});if(!remote)burst(p)}
FOMO_REMOTE.strokeListeners.push(d=>{if(d?.type==='point'&&seen)acceptStroke(d.id,d.p,true)});
touchCanvas.addEventListener('pointerdown',e=>{if(!seen)return;touchCanvas.setPointerCapture(e.pointerId);activeStroke='s'+Date.now()+'_'+(++strokeId);const p=drawPoint(e);acceptStroke(activeStroke,p);FOMO_REMOTE.stroke({type:'point',id:activeStroke,p:{x:p.x,y:p.y}})});
touchCanvas.addEventListener('pointermove',e=>{if(!activeStroke)return;const p=drawPoint(e),st=strokes.at(-1),last=st?.points.at(-1);if(last&&Math.hypot((p.x-last.x)*innerWidth,(p.y-last.y)*innerHeight)<2)return;acceptStroke(activeStroke,p);FOMO_REMOTE.stroke({type:'point',id:activeStroke,p:{x:p.x,y:p.y}})});
['pointerup','pointercancel','lostpointercapture'].forEach(event=>touchCanvas.addEventListener(event,()=>activeStroke=null));
function drawTouch(now){tc.clearRect(0,0,innerWidth,innerHeight);strokes=strokes.filter(s=>s.points.some(p=>now-p.t<1750));for(const s of strokes){for(let i=1;i<s.points.length;i++){const a=s.points[i-1],b=s.points[i],age=now-b.t,alpha=Math.max(0,1-age/1750);if(!alpha)continue;tc.beginPath();tc.moveTo(a.x*innerWidth,a.y*innerHeight);tc.lineTo(b.x*innerWidth,b.y*innerHeight);tc.lineWidth=1.9;tc.lineCap='round';tc.lineJoin='round';tc.strokeStyle=`rgba(255,255,255,${alpha*.88})`;tc.stroke()}}sparks=sparks.filter(p=>now-p.t<p.life);for(const p of sparks){const u=(now-p.t)/1000;tc.globalAlpha=Math.max(0,1-(now-p.t)/p.life);tc.fillStyle='#fff';tc.shadowColor='#fff';tc.shadowBlur=6;tc.beginPath();tc.arc(p.x+p.vx*u,p.y+p.vy*u,1.1,0,Math.PI*2);tc.fill()}tc.globalAlpha=1;tc.shadowBlur=0;requestAnimationFrame(drawTouch)}requestAnimationFrame(drawTouch);

const RESET_KEY='fomo_reset_signal_v711';
function handleReset(){
  const role=new URLSearchParams(window.location.search).get('role') || sessionStorage.getItem('fomo_v711_role_tab');
  if(['color','movimiento','forma'].includes(role)){
    sessionStorage.removeItem('fomo_v711_role_tab');
    sessionStorage.removeItem('fomo_v711_panel_'+role);window.location.replace(role+'.html');
  } else { window.location.reload(); }
}

document.getElementById('restart').onclick=async()=>{
  if(confirm('¿Reiniciar las tres intervenciones?')){
    await FOMO_REMOTE.reset();
    sessionStorage.removeItem('fomo_v711_draft_color');sessionStorage.removeItem('fomo_v711_draft_movimiento');sessionStorage.removeItem('fomo_v711_draft_forma');
    // El servidor notifica el reinicio a todos los navegadores.
    handleReset();
  }
};
